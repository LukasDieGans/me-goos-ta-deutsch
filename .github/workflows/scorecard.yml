# Me Goos-ta Deutsch – OpenSSF Scorecard (seit 2.5 G05): bewertet die Sicherheit des Repositorys (Branch-Schutz,
# gepinnte Actions, Token-Rechte, signierte Releases …) und zeigt das Ergebnis unter Security → Code scanning sowie
# öffentlich auf scorecard.dev. Nur auf main (dem Standard-Branch) und von Hand. Oben nur Lesen; Schreibrechte nur im
# Job: security-events (SARIF hochladen) und id-token (Ergebnis signiert veröffentlichen). Keine Secrets.
name: Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
