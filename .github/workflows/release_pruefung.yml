# Me Goos-ta Deutsch – Prüfung des veröffentlichten Releases (seit 2.2; ersetzt am 21.10.2026 den wöchentlichen Lauf).
# Läuft, sobald etwas für das Release auf main landet (veroeffentliche_release.py pusht main), und von Hand. Wartet, bis
# das neueste Release-ZIP genau den Inhalt dieses main-Commits hat (gegen SHA256SUMS.txt und Datei für Datei) und die
# Download-Seite seine Prüfsumme nennt, installiert es dann auf allen Systemen frisch (neueste Paketfassungen – so fallen
# kaputte Pakete auf, requirements.txt hat nur Spannen) und prüft Download-Seite und Web-App live in WebKit, Firefox und
# Chromium. Keine Person nötig, keine Secrets, nur Lesen. Kein Zeitplan (wird also nie pausiert).
name: Release-Pruefung

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prüfsumme des neuesten Releases (ZIP gegen SHA256SUMS.txt, auf main = Inhalt dieses Commits)
        run: python .github/ci/neuestes_release.py --ziel release --ergebnis ergebnis.json ${{ github.ref == 'refs/heads/main' && '--passend 40' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ergebnis-release
          path: ergebnis.json
          retention-days: 14
          if-no-files-found: warn

  frischtest:
    needs: release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm, os: windows-11-arm }
          - { name: macos-arm, os: macos-14 }        # macos-latest/-15/-26 (arm64) bekamen am 20.10.2026 keinen Runner
          - { name: macos-intel, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: desktop-file-validate (nur Linux, zum Prüfen des Menüeintrags)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq --no-install-recommends desktop-file-utils > /dev/null
      - name: Frischtest mit dem veröffentlichten Release
        run: python .github/ci/frischtest.py --neuestes-release --system ${{ matrix.name }} --ergebnis ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ergebnis-${{ matrix.name }}
          path: ergebnis.json
          retention-days: 14
          if-no-files-found: warn

  debian:
    needs: release
    name: debian-slim
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 45
    steps:
      - name: Minimal-System
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends wget ca-certificates tar python3 > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Frischtest mit dem veröffentlichten Release
        run: python3 .github/ci/frischtest.py --neuestes-release --system debian-slim --ergebnis ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ergebnis-debian-slim
          path: ergebnis.json
          retention-days: 14
          if-no-files-found: warn

  browser:
    needs: release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: browser-linux, os: ubuntu-latest, engines: "chromium,firefox,webkit" }
          - { name: browser-macos, os: macos-15-intel, engines: "webkit" }   # WebKit für macOS 14 ist eingefroren (hängt), macos-latest/-15 arm64 ohne Runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Playwright (Browser-Download bis zu dreimal – der Spiegel von Microsoft ist manchmal kurz weg)
        run: |
          python -m pip install -q playwright==1.63.0
          for i in 1 2 3; do python -m playwright install --with-deps $(echo "${{ matrix.engines }}" | tr ',' ' ') && break; [ "$i" = 3 ] && exit 1; sleep 20; done
      - name: Browser-Test gegen die Live-Adressen (Download-Seite, Web-App)
        run: python .github/ci/browser_test.py --live --neuestes-release --system ${{ matrix.name }} --engines ${{ matrix.engines }} --ergebnis ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ergebnis-${{ matrix.name }}
          path: ergebnis.json
          retention-days: 14
          if-no-files-found: warn
